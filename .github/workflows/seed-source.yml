name: Seed test repository from Conteo Rapido source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: anhjs01/Conteo-R-pido
          ref: main
          path: source
          fetch-depth: 1
      - name: Copy source project including Excel template
        run: |
          rsync -a --exclude='.git' source/ ./
          rm -rf source
      - name: Commit source baseline to test repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: copiar base original de Conteo Rápido para pruebas"
            git push origin HEAD:main
          fi
