name: Inspect remision template

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Excel template
        run: |
          python -m pip install --quiet openpyxl
          python - <<'PY'
          from openpyxl import load_workbook
          p = "REMISION (1).xlsx"
          w = load_workbook(p, data_only=False)
          print("SHEETS:", w.sheetnames)
          for s in w.worksheets:
              print("\nSHEET", s.title, "DIM", s.max_row, s.max_column, "MERGED", list(s.merged_cells.ranges))
              print("COLUMN_WIDTHS", {k:v.width for k,v in s.column_dimensions.items() if v.width})
              print("ROW_HEIGHTS", {k:v.height for k,v in s.row_dimensions.items() if v.height})
              for row in s.iter_rows():
                  cells = [f"{c.coordinate}={str(c.value)[:160]!r}" for c in row if c.value is not None]
                  if cells:
                      print(" | ".join(cells))
          PY
